services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpass
      POSTGRES_DB: blogdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blogdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./api
    container_name: blog-migrate
    command: ["node", "--experimental-strip-types", "--experimental-sqlite", "src/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://bloguser:blogpass@postgres:5432/blogdb
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./api
    container_name: blog-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://bloguser:blogpass@postgres:5432/blogdb
      JWT_SECRET: blog-jwt-secret-2026-dev
      CORS_ORIGIN: http://localhost:3001
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:3000
    container_name: blog-web
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
